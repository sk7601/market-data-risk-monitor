services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
      POSTGRES_DB: market
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["market-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d market"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://portfolio:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/market
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  market-data:
