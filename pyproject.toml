[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "market-data-risk-monitor"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pandas>=2.2,<3", "numpy>=2,<3", "plotly>=6,<7", "streamlit>=1.45,<2", "pandas-market-calendars>=5,<6", "yfinance>=0.2.65,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.coverage.run]
source = ["market.analytics", "market.validation"]
