name: quality
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: market_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio -d market_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=80
      - run: alembic upgrade head && alembic downgrade base && alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://portfolio:ci-only@localhost:5432/market_test
      - run: pytest tests/integration/test_pipeline.py
        env:
          TEST_DATABASE_URL: postgresql+psycopg://portfolio:ci-only@localhost:5432/market_test
